name: Build unsigned Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.0'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install locked dependencies
        run: npm ci

      - name: Run safe verification suite
        run: npm test

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check Rust crates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path installer/Cargo.toml --all -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo check --locked --manifest-path installer/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path installer/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
          cargo test --locked --manifest-path installer/Cargo.toml

      - name: Build unsigned Windows distribution
        run: npm run dist

      - name: Generate portable archive
        run: npm run release:package

      - name: Audit generated artifacts
        run: npm run audit:artifacts

      - name: Collect exact public release assets and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $launcher = 'dist/Sunday/Sunday.exe'
          $installer = 'dist/SundayInstaller.exe'
          $portable = "dist/SundayPortable_${version}_x64.zip"
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw 'The packaged Sunday.exe is missing.' }
          if ((Get-Item -LiteralPath $launcher).VersionInfo.ProductVersion -notlike "$version*") {
            throw 'Sunday.exe ProductVersion does not match package.json.'
          }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'SundayInstaller.exe is missing.' }
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) { throw 'The portable release archive is missing.' }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item -LiteralPath $installer -Destination release-assets/SundayInstaller.exe -Force
          Copy-Item -LiteralPath $portable -Destination "release-assets/SundayPortable_${version}_x64.zip" -Force
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii

      - name: Scan source and exact public assets for credential material
        run: npm run audit:release-secrets -- dist/Sunday release-assets

      - name: Upload exact unsigned release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sunday-v1.8.14-unsigned-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
