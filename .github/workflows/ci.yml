name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build on Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.0'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem src,test,scripts -Recurse -File -Include *.js,*.mjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.FullName)" }
          }

      - name: Run JavaScript tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install Rust advisory scanner
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file installer/Cargo.lock

      - name: Verify Rust formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path installer/Cargo.toml --all -- --check

      - name: Check, lint, and test Rust crates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
          cargo check --locked --manifest-path installer/Cargo.toml
          cargo clippy --locked --manifest-path installer/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path installer/Cargo.toml

      - name: Build development distribution
        run: npm run dist

      - name: Assemble portable release archive
        run: npm run release:package

      - name: Audit generated artifacts
        run: npm run audit:artifacts

      - name: Qualify release manifest implementation
        run: npm run test:release-manifest

      - name: Verify tracked tree remains unchanged
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified tracked files.' }
