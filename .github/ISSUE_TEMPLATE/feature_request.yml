name: Feature request
description: Propose a focused improvement to SUNDAY Launcher.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the problem first. Do not include private account or credential data.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem should be addressed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, not only an implementation preference.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Who benefits and under what authorized workflow?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts and sessions
        - Games and discovery
        - Process management
        - Legacy compatibility
        - Installer and release
        - Documentation and contributor tooling
        - Other
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: This request does not require weakening ownership, signing, path, or security validation.
          required: true
        - label: I have not included credentials or personal data.
          required: true
