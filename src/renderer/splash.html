<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;" />
  <style>
    :root { --ink: #fff8f1; --ink-2: #b9a99d; --hair: #3a2e27; --accent: #f26a2e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .stage {
      width: 100vw; height: 100vh; display: grid; place-items: center;
      background: #100e0c; border-radius: 10px; border: 1px solid var(--hair);
      box-shadow: 0 24px 70px rgba(0,0,0,.5);
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      opacity: 0; animation: stageIn .5s cubic-bezier(.2,.8,.2,1) forwards;
    }
    body.out .stage { opacity: 0; transform: scale(.985); transition: opacity .42s ease, transform .42s ease; }
    @keyframes stageIn { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }

    .center { text-align: center; }
    .mark { width: 64px; height: 64px; margin: 0 auto 18px; opacity: 0; animation: markIn .5s .18s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes markIn { from { opacity: 0; transform: translateY(5px) scale(.96); } to { opacity: 1; transform: none; } }

    .word { font-family: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", sans-serif; font-size: 30px; font-weight: 650; letter-spacing: .13em; color: var(--ink);
      display: inline-flex; overflow: hidden; }
    .word span { display: inline-block; transform: translateY(105%); opacity: 0;
      animation: letter .6s cubic-bezier(.2,.8,.2,1) forwards; }
    .word span:nth-child(1) { animation-delay: .42s; }
    .word span:nth-child(2) { animation-delay: .48s; }
    .word span:nth-child(3) { animation-delay: .54s; }
    .word span:nth-child(4) { animation-delay: .60s; }
    .word span:nth-child(5) { animation-delay: .66s; }
    .word span:nth-child(6) { animation-delay: .72s; }
    @keyframes letter { to { transform: none; opacity: 1; } }

    .tag { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); letter-spacing: .04em;
      opacity: 0; animation: fadeUp .5s .8s ease forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: .9; transform: none; } }

    .track { margin: 26px auto 0; width: 150px; height: 2px; border-radius: 2px; background: #332820; overflow: hidden; }
    .track::after { content: ""; display: block; height: 100%; width: 40%; background: var(--accent);
      border-radius: 2px; transform: translateX(-110%); animation: sweep 1.5s .7s cubic-bezier(.45,.05,.35,1) infinite; }
    @keyframes sweep { to { transform: translateX(320%); } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="center">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="15" fill="#17120f" stroke="#4a3528" stroke-width="2"/><path d="M9 44h46" stroke="#6b4732" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="32" r="18" fill="#f26a2e"/><path d="M43 22c-3-3-7-4-12-4-6 0-11 3-11 8 0 5 5 7 12 8 8 2 12 4 12 10 0 6-5 10-13 10-6 0-11-2-15-6" fill="none" stroke="#17120f" stroke-width="6" stroke-linecap="round"/><path d="M14 44h36" stroke="#ffad7c" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="word"><span>S</span><span>U</span><span>N</span><span>D</span><span>A</span><span>Y</span></div>
      <div class="tag">Launcher · Created by SADINKAI</div>
      <div class="track"></div>
    </div>
  </div>
</body>
</html>
