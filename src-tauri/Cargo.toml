[package]
name = "sunday-launcher"
version = "1.8.17"
description = "SUNDAY Launcher - manage multiple Roblox accounts and launch multiple Roblox clients on Windows"
authors = ["SADINKAI"]
license = "MIT"
edition = "2021"
rust-version = "1.96.0"

[lib]
name = "sunday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[features]
default = []
